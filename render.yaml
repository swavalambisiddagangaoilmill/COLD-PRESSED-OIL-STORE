services:
  - type: web
    name: swavalambi-siddaganga-oil-mill-api
    runtime: node
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: CLIENT_URLS
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: WHATSAPP_MODE
        value: test
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_OTP_TEMPLATE_NAME
        sync: false
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: en_US
      - key: CASHFREE_ENVIRONMENT
        value: production
      - key: CASHFREE_CLIENT_ID
        sync: false
      - key: CASHFREE_CLIENT_SECRET
        sync: false
      - key: SHIPROCKET_MOCK
        value: "true"
      - key: JWT_SECRET
        generateValue: true
