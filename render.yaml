services:
  - type: web
    name: swavalambi-siddaganga-oil-mill-api
    runtime: node
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: CLIENT_URLS
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: CASHFREE_ENVIRONMENT
        value: production
      - key: CASHFREE_CLIENT_ID
        sync: false
      - key: CASHFREE_CLIENT_SECRET
        sync: false
      - key: CASHFREE_API_VERSION
        value: 2025-01-01
      - key: SHIPROCKET_MOCK
        value: "true"
      - key: JWT_SECRET
        generateValue: true
